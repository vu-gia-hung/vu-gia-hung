<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="slotBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0c172e" />
      <stop offset="60%" stop-color="#060913" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <filter id="slotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

    @keyframes pulseSlotBorder {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.8; }
    }
    .slot-dash {
      animation: pulseSlotBorder 3.5s infinite ease-in-out;
    }
  </style>

  <!-- Outer Card Frame -->
  <rect x="6" y="6" width="788" height="568" rx="20" fill="url(#slotBg)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Dashed Inner Slot Outline (Reserved Slot) -->
  <rect class="slot-dash" x="30" y="30" width="740" height="520" rx="16" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="12,10" />

  <!-- Ambient Space Dust -->
  <g opacity="0.3">
    <circle cx="90" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="710" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="100" cy="500" r="1.5" fill="#38bdf8" />
    <circle cx="700" cy="500" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Center Holographic Oracle Sphere Icon -->
  <g transform="translate(400, 240)">
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="75" fill="#0284c7" opacity="0.15" filter="url(#slotGlow)" />
    
    <!-- Outer Hexagon / Tech Ring -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="8,6" />
    
    <!-- Inner Mystical Glowing Orb -->
    <circle cx="0" cy="0" r="45" fill="#091427" stroke="#38bdf8" stroke-width="2" />
    <circle cx="-12" cy="-12" r="12" fill="#38bdf8" opacity="0.4" filter="url(#slotGlow)" />

    <!-- Crystal Orb Reflections -->
    <path d="M -25 -10 Q 0 -35 25 -10" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.8" />
    <polygon points="0,-18 5,-8 18,-5 8,5 10,18 0,11 -10,18 -8,5 -18,-5 -5,-8" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Slot Title & Description -->
  <g transform="translate(400, 360)">
    <text x="0" y="0" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle" class="font-mono" letter-spacing="1.5">
      ✦ RESERVED SLOT ✦
    </text>

    <text x="0" y="32" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" class="font-sans">
      Coder Tarot &amp; Fortune Teller
    </text>

    <text x="0" y="60" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="middle" class="font-sans">
      Interactive destiny oracle loading in next update...
    </text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(400, 500)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#091427" stroke="#0284c7" stroke-width="1" />
    <text x="0" y="5" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">
      🔮 COMING SOON
    </text>
  </g>
</svg>
