<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#0d1f3b" />
      <stop offset="55%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Leather Cover Gradient -->
    <linearGradient id="coverLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Chrome Corner Bracket Gradient -->
    <linearGradient id="cornerChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Center Spine Highlight Gradient -->
    <linearGradient id="spineHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="20%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Left Page Parchment Surface Gradient -->
    <linearGradient id="leftPageSurf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1325" />
      <stop offset="8%" stop-color="#111c33" />
      <stop offset="30%" stop-color="#16233f" />
      <stop offset="85%" stop-color="#192847" />
      <stop offset="100%" stop-color="#080e1b" />
    </linearGradient>

    <!-- Right Page Parchment Surface Gradient -->
    <linearGradient id="rightPageSurf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080e1b" />
      <stop offset="15%" stop-color="#192847" />
      <stop offset="70%" stop-color="#16233f" />
      <stop offset="92%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#0b1325" />
    </linearGradient>

    <!-- Silk Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Fountain Pen Barrel Gradient -->
    <linearGradient id="penBarrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="55%" stop-color="#090d16" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Fountain Pen Nib Metallic Gradient -->
    <linearGradient id="penNibMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="cyanAtmosphere" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softContactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <style>
    .book-container {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .book-container:hover {
      transform: translateY(-6px);
    }
    .pen-element {
      transition: transform 0.4s ease;
    }
    .book-container:hover .pen-element {
      transform: translate(-3px, -3px) rotate(-1deg);
    }
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.6; }
    }
    .ambient-glow {
      animation: gentlePulse 4s infinite ease-in-out;
    }
  </style>

  <!-- Card Background Frame -->
  <rect x="8" y="8" width="784" height="584" rx="22" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2" />
  <rect x="12" y="12" width="776" height="576" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Ambient Stars in Dark Space -->
  <g opacity="0.35">
    <circle cx="85" cy="75" r="1.5" fill="#38bdf8" />
    <circle cx="150" cy="120" r="1" fill="#7dd3fc" />
    <circle cx="705" cy="75" r="1.5" fill="#38bdf8" />
    <circle cx="725" cy="135" r="1" fill="#ffffff" />
    <circle cx="75" cy="515" r="1.5" fill="#38bdf8" />
    <circle cx="715" cy="510" r="1.5" fill="#7dd3fc" />
    <circle cx="400" cy="40" r="1" fill="#ffffff" />
    <circle cx="400" cy="565" r="1" fill="#38bdf8" />
  </g>

  <!-- Ambient Blue Glow behind Book -->
  <ellipse cx="400" cy="305" rx="350" ry="220" fill="#0284c7" class="ambient-glow" filter="url(#cyanAtmosphere)" />

  <g class="book-container">
    <!-- Grounding Contact Shadow Beneath the Whole Book -->
    <ellipse cx="400" cy="520" rx="345" ry="26" fill="#000000" opacity="0.9" filter="url(#softContactShadow)" />
    <ellipse cx="400" cy="520" rx="320" ry="18" fill="#000000" opacity="0.8" />

    <!-- ==================== 1. HARDCOVER LEATHER BASE ==================== -->
    <!-- Left Leather Cover Flap -->
    <path d="M 52 70 Q 230 64 395 72 L 395 514 Q 230 508 52 514 Z" fill="url(#coverLeather)" stroke="#0c4a6e" stroke-width="2" />
    <!-- Right Leather Cover Flap -->
    <path d="M 405 72 Q 570 64 748 70 L 748 514 Q 570 508 405 514 Z" fill="url(#coverLeather)" stroke="#0c4a6e" stroke-width="2" />

    <!-- Handcrafted Leather Stitches (Dashed Cyan Lines) -->
    <path d="M 62 80 Q 230 74 388 80 L 388 504 Q 230 498 62 504 Z" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.55" />
    <path d="M 412 80 Q 570 74 738 80 L 738 504 Q 570 498 412 504 Z" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.55" />

    <!-- 4 Metallic Corner Brackets -->
    <!-- Top-Left Corner -->
    <path d="M 52 110 L 52 70 L 92 70 Q 72 90 52 110 Z" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="68" cy="86" r="2.5" fill="#020617" />
    <!-- Bottom-Left Corner -->
    <path d="M 52 474 L 52 514 L 92 514 Q 72 494 52 474 Z" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="68" cy="498" r="2.5" fill="#020617" />
    <!-- Top-Right Corner -->
    <path d="M 748 110 L 748 70 L 708 70 Q 728 90 748 110 Z" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="732" cy="86" r="2.5" fill="#020617" />
    <!-- Bottom-Right Corner -->
    <path d="M 748 474 L 748 514 L 708 514 Q 728 494 748 474 Z" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="732" cy="498" r="2.5" fill="#020617" />

    <!-- ==================== 2. MULTI-LAYER STACKED PAGES (PAGE DEPTH) ==================== -->
    <!-- Left Stacked Pages Layers (Simulating thick block of papers) -->
    <path d="M 76 80 L 392 82 L 392 502 L 76 502 Z" fill="#060a14" />
    <path d="M 73 83 L 392 84 L 392 499 L 73 499 Z" fill="#090f1d" />
    <path d="M 70 86 L 392 86 L 392 496 L 70 496 Z" fill="#0c1426" stroke="#1e293b" stroke-width="0.5" />
    <path d="M 67 89 L 392 88 L 392 493 L 67 493 Z" fill="#101a30" />
    <path d="M 64 92 L 392 90 L 392 490 L 64 490 Z" fill="#13203b" stroke="#1e293b" stroke-width="0.5" />
    <path d="M 62 95 L 392 92 L 392 487 L 62 487 Z" fill="#172645" />

    <!-- Right Stacked Pages Layers -->
    <path d="M 408 82 L 724 80 L 724 502 L 408 502 Z" fill="#060a14" />
    <path d="M 408 84 L 727 83 L 727 499 L 408 499 Z" fill="#090f1d" />
    <path d="M 408 86 L 730 86 L 730 496 L 408 496 Z" fill="#0c1426" stroke="#1e293b" stroke-width="0.5" />
    <path d="M 408 88 L 733 89 L 733 493 L 408 493 Z" fill="#101a30" />
    <path d="M 408 90 L 736 92 L 736 490 L 408 490 Z" fill="#13203b" stroke="#1e293b" stroke-width="0.5" />
    <path d="M 408 92 L 738 95 L 738 487 L 408 487 Z" fill="#172645" />

    <!-- ==================== 3. TOP OPEN PARCHMENT PAGES ==================== -->
    <!-- Left Top Page (Arched upward from binding) -->
    <path d="M 395 94 Q 230 84 66 93 L 66 484 Q 230 492 395 484 Z" fill="url(#leftPageSurf)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Right Top Page (Arched upward from binding) -->
    <path d="M 405 94 Q 570 84 734 93 L 734 484 Q 570 492 405 484 Z" fill="url(#rightPageSurf)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Subtle Faint Ruled Lines on Left Page (Pure notebook guidelines, NO text) -->
    <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
      <line x1="95" y1="135" x2="365" y2="137" />
      <line x1="95" y1="165" x2="365" y2="167" />
      <line x1="95" y1="195" x2="365" y2="197" />
      <line x1="95" y1="225" x2="365" y2="227" />
      <line x1="95" y1="255" x2="365" y2="257" />
      <line x1="95" y1="285" x2="365" y2="287" />
      <line x1="95" y1="315" x2="365" y2="317" />
      <line x1="95" y1="345" x2="365" y2="347" />
      <line x1="95" y1="375" x2="365" y2="377" />
      <line x1="95" y1="405" x2="365" y2="407" />
      <line x1="95" y1="435" x2="365" y2="437" />
    </g>

    <!-- Subtle Faint Ruled Lines on Right Page (Pure notebook guidelines, NO text) -->
    <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
      <line x1="435" y1="137" x2="705" y2="135" />
      <line x1="435" y1="167" x2="705" y2="165" />
      <line x1="435" y1="197" x2="705" y2="195" />
      <line x1="435" y1="227" x2="705" y2="225" />
      <line x1="435" y1="257" x2="705" y2="255" />
      <line x1="435" y1="287" x2="705" y2="285" />
      <line x1="435" y1="317" x2="705" y2="315" />
      <line x1="435" y1="347" x2="705" y2="345" />
      <line x1="435" y1="377" x2="705" y2="375" />
      <line x1="435" y1="407" x2="705" y2="405" />
      <line x1="435" y1="437" x2="705" y2="435" />
    </g>

    <!-- Central Deep Binding Gutter & Spine Shadow -->
    <path d="M 393 92 L 407 92 L 407 486 L 393 486 Z" fill="#04060d" />
    <path d="M 398 70 L 402 70 L 402 516 L 398 516 Z" fill="url(#spineHighlight)" />

    <!-- Silk Bookmark Ribbon (Draped across binding and right page) -->
    <path d="M 400 68 Q 425 180 435 300 Q 445 420 460 528 L 478 522 L 468 492 L 492 486 Q 460 380 445 260 Q 430 140 404 68 Z" fill="url(#ribbonSilk)" opacity="0.95" filter="url(#cyanAtmosphere)" />

    <!-- ==================== 4. REALISTIC LUXURY FOUNTAIN PEN ==================== -->
    <g class="pen-element" transform="translate(615, 360) rotate(-28)">
      <!-- Pen Cast Shadow on paper -->
      <rect x="0" y="16" width="220" height="18" rx="9" fill="#000000" opacity="0.55" filter="url(#cyanAtmosphere)" />
      
      <!-- Pen Cap / Finial End -->
      <rect x="180" y="0" width="30" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      
      <!-- Pen Barrel (Thân Bút) -->
      <rect x="50" y="0" width="132" height="18" rx="3" fill="url(#penBarrel)" stroke="#334155" stroke-width="1" />
      
      <!-- Chrome & Cyan Accent Rings -->
      <rect x="62" y="0" width="4" height="18" fill="#38bdf8" />
      <rect x="66" y="0" width="1.5" height="18" fill="#ffffff" />
      <rect x="172" y="0" width="8" height="18" fill="url(#cornerChrome)" />
      <rect x="174" y="0" width="2" height="18" fill="#ffffff" />
      
      <!-- Pen Metallic Pocket Clip -->
      <rect x="100" y="-4" width="70" height="4" rx="2" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="0.5" />
      <circle cx="102" cy="-2" r="3" fill="#38bdf8" />
      
      <!-- Pen Grip Section (Cổ Bút) -->
      <path d="M 50 1 L 22 4 L 22 14 L 50 17 Z" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
      <rect x="22" y="4" width="3" height="10" fill="#38bdf8" />
      
      <!-- Metallic Pen Nib (Ngòi Bút Chạm Khắc) -->
      <path d="M 22 4 L 0 9 L 22 14 Z" fill="url(#penNibMetal)" stroke="#7dd3fc" stroke-width="1" />
      
      <!-- Nib Breather Hole & Ink Slit -->
      <line x1="0" y1="9" x2="15" y2="9" stroke="#060913" stroke-width="1.2" />
      <circle cx="15" cy="9" r="1.6" fill="#060913" />
      
      <!-- Glowing Blue Ink Droplet at Nib Tip -->
      <circle cx="-1" cy="9" r="3.5" fill="#38bdf8" opacity="0.9" filter="url(#cyanAtmosphere)" />
      <circle cx="-1" cy="9" r="1.5" fill="#ffffff" />
    </g>
  </g>
</svg>
