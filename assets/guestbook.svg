<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="60%" stop-color="#060913" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Leather Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Center Spine Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Left Page Parchment Gradient -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="15%" stop-color="#131e36" />
      <stop offset="85%" stop-color="#182542" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Right Page Parchment Gradient -->
    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="15%" stop-color="#182542" />
      <stop offset="85%" stop-color="#131e36" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pen Body Gradient -->
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pen Nib Gradient -->
    <linearGradient id="penNib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    
    .interactive-card {
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .interactive-card:hover .btn-box {
      fill: #38bdf8;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.8));
    }
    .interactive-card:hover .pen-group {
      transform: translate(-4px, -4px);
    }
    .pen-group {
      transition: transform 0.3s ease;
    }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .glow-pulse {
      animation: pulseGlow 3s infinite ease-in-out;
    }
  </style>

  <!-- Outer Card Frame -->
  <rect x="8" y="8" width="784" height="584" rx="20" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2" />
  <rect x="12" y="12" width="776" height="576" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ambient Star Dust Particles in Background -->
  <g opacity="0.4">
    <circle cx="90" cy="70" r="1.5" fill="#38bdf8" />
    <circle cx="160" cy="110" r="1" fill="#7dd3fc" />
    <circle cx="710" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="730" cy="140" r="1" fill="#bae6fd" />
    <circle cx="80" cy="520" r="1.5" fill="#38bdf8" />
    <circle cx="720" cy="510" r="1.5" fill="#7dd3fc" />
    <circle cx="400" cy="45" r="1" fill="#ffffff" />
  </g>

  <!-- Top Ambient Glow under book -->
  <ellipse cx="400" cy="300" rx="360" ry="240" fill="#0284c7" opacity="0.08" filter="url(#cyanGlow)" />

  <g class="interactive-card">
    <!-- Under-Book Drop Shadow -->
    <ellipse cx="400" cy="515" rx="340" ry="24" fill="#000000" opacity="0.75" />

    <!-- 1. Outer Hardcover Backing (Book Cover) -->
    <!-- Left Cover Flap -->
    <rect x="52" y="70" width="342" height="435" rx="14" fill="url(#coverGrad)" stroke="#0c4a6e" stroke-width="2" filter="url(#bookShadow)" />
    <!-- Right Cover Flap -->
    <rect x="406" y="70" width="342" height="435" rx="14" fill="url(#coverGrad)" stroke="#0c4a6e" stroke-width="2" />

    <!-- Outer Leather Stitches (Cosmic Cyan Dashed) -->
    <rect x="60" y="78" width="326" height="419" rx="10" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.5" />
    <rect x="414" y="78" width="326" height="419" rx="10" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.5" />

    <!-- Metallic Corner Protectors (4 corners) -->
    <!-- Top-Left -->
    <path d="M 52 105 L 52 70 L 87 70 Q 70 87 52 105 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Bottom-Left -->
    <path d="M 52 470 L 52 505 L 87 505 Q 70 488 52 470 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Top-Right -->
    <path d="M 748 105 L 748 70 L 713 70 Q 730 87 748 105 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Bottom-Right -->
    <path d="M 748 470 L 748 505 L 713 505 Q 730 488 748 470 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />

    <!-- 2. Stacked Pages (Simulating real 3D page depth) -->
    <!-- Left stack layers -->
    <path d="M 68 85 L 390 85 L 390 492 L 68 492 Z" fill="#090d16" />
    <path d="M 65 88 L 390 88 L 390 489 L 65 489 Z" fill="#0c1322" />
    <path d="M 62 91 L 390 91 L 390 486 L 62 486 Z" fill="#111a2e" stroke="#1e293b" stroke-width="0.5" />

    <!-- Right stack layers -->
    <path d="M 410 85 L 732 85 L 732 492 L 410 492 Z" fill="#090d16" />
    <path d="M 410 88 L 735 88 L 735 489 L 410 489 Z" fill="#0c1322" />
    <path d="M 410 91 L 738 91 L 738 486 L 410 486 Z" fill="#111a2e" stroke="#1e293b" stroke-width="0.5" />

    <!-- 3. Top Open Pages (Main parchment surface) -->
    <!-- Left Open Page with arched curve from spine -->
    <path d="M 395 92 Q 235 84 72 90 L 72 482 Q 235 488 395 482 Z" fill="url(#leftPageGrad)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Right Open Page with arched curve from spine -->
    <path d="M 405 92 Q 565 84 728 90 L 728 482 Q 565 488 405 482 Z" fill="url(#rightPageGrad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Center Fold Shadow (Gáy sổ) -->
    <rect x="390" y="88" width="20" height="396" fill="#060913" opacity="0.85" />
    <rect x="398" y="70" width="4" height="435" fill="url(#spineGrad)" />

    <!-- Bookmark Ribbon (Ruy băng đánh dấu trang) -->
    <path d="M 400 70 Q 425 180 435 300 Q 445 420 460 525 L 478 520 L 468 490 L 490 485 Q 460 380 445 260 Q 430 140 404 70 Z" fill="url(#ribbonGrad)" opacity="0.9" filter="url(#cyanGlow)" />

    <!-- ==================== LEFT PAGE CONTENT ==================== -->
    <g transform="translate(90, 110)">
      <!-- Page Header -->
      <rect x="0" y="0" width="135" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <text x="67" y="16" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">📖 GUESTBOOK</text>

      <text x="0" y="52" fill="#f8fafc" font-size="20" font-weight="800" class="font-sans">Visitor Archive</text>
      <text x="0" y="72" fill="#94a3b8" font-size="12" class="font-sans">Official digital guestbook &amp; log</text>

      <!-- Decorative Divider -->
      <line x1="0" y1="88" x2="270" y2="88" stroke="#1e293b" stroke-width="1.5" />
      <line x1="0" y1="88" x2="90" y2="88" stroke="#38bdf8" stroke-width="2" />
      <polygon points="90,85 96,88 90,91 84,88" fill="#38bdf8" />

      <!-- Sample Historical Signatures / Lined Logs -->
      <g transform="translate(0, 110)">
        <!-- Entry 1 -->
        <circle cx="10" cy="10" r="4" fill="#38bdf8" />
        <text x="24" y="14" fill="#38bdf8" font-size="12" font-weight="700" class="font-mono">@rmit-crew</text>
        <text x="24" y="32" fill="#cbd5e1" font-size="11.5" font-style="italic" class="font-sans">"Chào đồng môn RMIT! Profile đỉnh quá! 🌟"</text>
        <line x1="0" y1="46" x2="270" y2="46" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />

        <!-- Entry 2 -->
        <circle cx="10" cy="66" r="4" fill="#0284c7" />
        <text x="24" y="70" fill="#38bdf8" font-size="12" font-weight="700" class="font-mono">@open-source</text>
        <text x="24" y="88" fill="#cbd5e1" font-size="11.5" font-style="italic" class="font-sans">"Awesome AI &amp; embedded engineering! 🚀"</text>
        <line x1="0" y1="102" x2="270" y2="102" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />

        <!-- Entry 3 -->
        <circle cx="10" cy="122" r="4" fill="#38bdf8" opacity="0.6" />
        <text x="24" y="126" fill="#7dd3fc" font-size="12" font-weight="700" class="font-mono">@github-visitor</text>
        <text x="24" y="144" fill="#94a3b8" font-size="11.5" font-style="italic" class="font-sans">"Left a cosmic star on your repositories! ⭐"</text>
        <line x1="0" y1="158" x2="270" y2="158" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
      </g>

      <!-- Circular Verification Seal (Bottom Left) -->
      <g transform="translate(180, 305)" opacity="0.75">
        <circle cx="40" cy="40" r="32" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3" />
        <circle cx="40" cy="40" r="26" fill="none" stroke="#0284c7" stroke-width="1" />
        <text x="40" y="36" fill="#38bdf8" font-size="8" font-weight="800" text-anchor="middle" class="font-mono">★ VERIFIED ★</text>
        <text x="40" y="48" fill="#7dd3fc" font-size="7" font-weight="600" text-anchor="middle" class="font-mono">HUNGS SPACE</text>
      </g>
    </g>

    <!-- ==================== RIGHT PAGE CONTENT ==================== -->
    <g transform="translate(435, 110)">
      <!-- Main Call-to-Action Glassmorphic Card -->
      <rect x="0" y="15" width="275" height="315" rx="16" fill="#080e1a" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.5" />
      <rect x="4" y="19" width="267" height="307" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

      <!-- Top Badge on Card -->
      <g transform="translate(20, 35)">
        <rect x="0" y="0" width="105" height="22" rx="11" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
        <text x="52" y="15" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">✦ LIVE ACCESS</text>
      </g>

      <!-- Main Instruction Text (Requested by user in English) -->
      <g transform="translate(20, 85)">
        <text x="0" y="0" fill="#ffffff" font-size="21" font-weight="800" class="font-sans">
          CLICK HERE TO
        </text>
        <text x="0" y="26" fill="#38bdf8" font-size="21" font-weight="800" class="font-sans">
          SIGN GUESTBOOK
        </text>

        <text x="0" y="58" fill="#cbd5e1" font-size="13" font-weight="500" class="font-sans">
          Leave your mark &amp; greeting
        </text>
        <text x="0" y="78" fill="#94a3b8" font-size="13" font-weight="400" class="font-sans">
          on Vũ Gia Hưng's GitHub profile!
        </text>
        <text x="0" y="104" fill="#38bdf8" font-size="12" font-style="italic" class="font-mono">
          ~ Instant automated sync ~
        </text>
      </g>

      <!-- Big Glowing Action Button (Interactive Pill) -->
      <g transform="translate(20, 240)">
        <!-- Outer glow aura -->
        <rect x="-2" y="-2" width="239" height="52" rx="26" fill="#38bdf8" opacity="0.3" class="glow-pulse" filter="url(#cyanGlow)" />
        <!-- Button rectangle -->
        <rect class="btn-box" x="0" y="0" width="235" height="48" rx="24" fill="url(#btnGrad)" stroke="#bae6fd" stroke-width="1.5" />
        
        <!-- Button Text -->
        <text x="117" y="30" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" class="font-sans" letter-spacing="0.5">
          ✍️ SIGN GUESTBOOK ➔
        </text>
      </g>
    </g>

    <!-- 4. Realistic Luxury Fountain Pen (Crossing lower right corner) -->
    <g class="pen-group" transform="translate(620, 390) rotate(-35)">
      <!-- Pen Shadow on paper -->
      <rect x="0" y="18" width="180" height="14" rx="7" fill="#000000" opacity="0.6" filter="url(#cyanGlow)" />
      
      <!-- Pen Barrel (Thân bút) -->
      <rect x="40" y="0" width="130" height="16" rx="3" fill="url(#penBody)" stroke="#475569" stroke-width="1" />
      
      <!-- Gold/Cyan Decorative Bands on Pen -->
      <rect x="55" y="0" width="4" height="16" fill="#38bdf8" />
      <rect x="155" y="0" width="6" height="16" fill="#38bdf8" />
      <rect x="157" y="0" width="2" height="16" fill="#ffffff" />
      
      <!-- Pen Grip Section -->
      <path d="M 40 1 L 20 4 L 20 12 L 40 15 Z" fill="#0f172a" stroke="#334155" stroke-width="1" />
      
      <!-- Metallic Pen Nib (Ngòi bút) -->
      <path d="M 20 4 L 0 8 L 20 12 Z" fill="url(#penNib)" stroke="#38bdf8" stroke-width="1" />
      <!-- Nib Breather Hole & Slit -->
      <line x1="0" y1="8" x2="14" y2="8" stroke="#090d16" stroke-width="1" />
      <circle cx="14" cy="8" r="1.5" fill="#090d16" />
      
      <!-- Glowing Cyan Ink Sparkle at Nib Tip -->
      <circle cx="-2" cy="8" r="3" fill="#38bdf8" filter="url(#cyanGlow)" />
      <circle cx="-2" cy="8" r="1.5" fill="#ffffff" />
    </g>
  </g>
</svg>
