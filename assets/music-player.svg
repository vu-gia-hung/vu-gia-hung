<svg xmlns="http://www.w3.org/2000/svg" width="680" height="110" viewBox="0 0 680 110" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="barGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes bounce1 { 0%, 100% { height: 8px; y: 46px; } 50% { height: 28px; y: 26px; } }
    @keyframes bounce2 { 0%, 100% { height: 26px; y: 28px; } 50% { height: 10px; y: 44px; } }
    @keyframes bounce3 { 0%, 100% { height: 16px; y: 38px; } 50% { height: 34px; y: 20px; } }
    @keyframes bounce4 { 0%, 100% { height: 30px; y: 24px; } 50% { height: 12px; y: 42px; } }
    @keyframes bounce5 { 0%, 100% { height: 12px; y: 42px; } 50% { height: 24px; y: 30px; } }
    @keyframes pulseLive { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } }
    .eq1 { animation: bounce1 1.2s ease-in-out infinite; }
    .eq2 { animation: bounce2 0.9s ease-in-out infinite 0.15s; }
    .eq3 { animation: bounce3 1.4s ease-in-out infinite 0.3s; }
    .eq4 { animation: bounce4 1.1s ease-in-out infinite 0.1s; }
    .eq5 { animation: bounce5 1.3s ease-in-out infinite 0.25s; }
    .live-dot { animation: pulseLive 1.8s ease-in-out infinite; transform-origin: 30px 22px; }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="678" height="108" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: Vinyl / Equalizer Container -->
  <rect x="16" y="18" width="74" height="74" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Animated Equalizer Bars -->
  <g fill="url(#barGlow)">
    <rect class="eq1" x="27" y="36" width="5" height="20" rx="2.5"/>
    <rect class="eq2" x="37" y="30" width="5" height="26" rx="2.5"/>
    <rect class="eq3" x="47" y="24" width="5" height="32" rx="2.5"/>
    <rect class="eq4" x="57" y="32" width="5" height="24" rx="2.5"/>
    <rect class="eq5" x="67" y="40" width="5" height="16" rx="2.5"/>
  </g>

  <!-- Middle: Track Metadata -->
  <!-- Status Badge -->
  <g class="live-dot">
    <circle cx="106" cy="28" r="4" fill="#10b981" filter="url(#glow)"/>
  </g>
  <text x="117" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">NOW FOCUSING • DEEP WORK AUDIO</text>

  <!-- Song / Session Title -->
  <text x="106" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Synthwave &amp; Cyberpunk Lo-Fi (Cosmic Engineering Session)</text>

  <!-- Artist / Station -->
  <text x="106" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Vũ Gia Hưng • Terminal &amp; Architecture Flow</text>

  <!-- Progress Bar -->
  <rect x="106" y="82" width="460" height="4" rx="2" fill="#1e293b"/>
  <rect x="106" y="82" width="290" height="4" rx="2" fill="url(#cyanPurple)"/>
  <circle cx="396" cy="84" r="5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Timestamps -->
  <text x="576" y="87" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">02:47 / 04:12</text>

  <!-- Controls (Right Side) -->
  <!-- Previous -->
  <path d="M616 38 L608 44 L616 50 Z M607 38 L607 50" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Play/Pause Button -->
  <circle cx="636" cy="44" r="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="632" y="39" width="3" height="10" rx="1.5" fill="#38bdf8"/>
  <rect x="637" y="39" width="3" height="10" rx="1.5" fill="#38bdf8"/>
  <!-- Next -->
  <path d="M656 38 L664 44 L656 50 Z M665 38 L665 50" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
