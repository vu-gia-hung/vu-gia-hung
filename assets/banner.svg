<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#091224" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      @keyframes pulseDot {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes shimmer {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #a5f3fc; }
        100% { stop-color: #38bdf8; }
      }
      .twinkle { animation: pulseDot 3s ease-in-out infinite; }
      .twinkle-2 { animation: pulseDot 4s ease-in-out infinite 1.5s; }
      .pill { transition: all 0.3s ease; }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="876" height="246" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="80" r="140" fill="url(#cyanGlow)" />
  <circle cx="740" cy="180" r="150" fill="url(#indigoGlow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.75">
    <line x1="40" y1="0" x2="40" y2="250" />
    <line x1="120" y1="0" x2="120" y2="250" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="280" y1="0" x2="280" y2="250" />
    <line x1="360" y1="0" x2="360" y2="250" />
    <line x1="440" y1="0" x2="440" y2="250" />
    <line x1="520" y1="0" x2="520" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
    <line x1="680" y1="0" x2="680" y2="250" />
    <line x1="760" y1="0" x2="760" y2="250" />
    <line x1="840" y1="0" x2="840" y2="250" />
    <line x1="0" y1="50" x2="880" y2="50" />
    <line x1="0" y1="100" x2="880" y2="100" />
    <line x1="0" y1="150" x2="880" y2="150" />
    <line x1="0" y1="200" x2="880" y2="200" />
  </g>

  <!-- Starfield Points -->
  <g fill="#38bdf8">
    <circle cx="85" cy="45" r="1.5" class="twinkle" opacity="0.8" />
    <circle cx="210" cy="35" r="1" class="twinkle-2" opacity="0.6" />
    <circle cx="340" cy="70" r="1.5" class="twinkle" opacity="0.7" />
    <circle cx="490" cy="30" r="1" class="twinkle-2" opacity="0.5" />
    <circle cx="680" cy="55" r="1.5" class="twinkle" opacity="0.8" />
    <circle cx="810" cy="40" r="1" class="twinkle-2" opacity="0.6" />
    <circle cx="75" cy="180" r="1" class="twinkle-2" opacity="0.6" />
    <circle cx="260" cy="210" r="1.5" class="twinkle" opacity="0.7" />
    <circle cx="580" cy="195" r="1" class="twinkle-2" opacity="0.5" />
    <circle cx="790" cy="215" r="1.5" class="twinkle" opacity="0.8" />
  </g>

  <!-- Decorative Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 16 32 L 16 16 L 32 16" />
    <path d="M 864 32 L 864 16 L 848 16" />
    <path d="M 16 218 L 16 234 L 32 234" />
    <path d="M 864 218 L 864 234 L 848 234" />
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(48, 42)">
    <rect x="0" y="0" width="270" height="26" rx="13" fill="#0e172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#34d399" />
    <circle cx="14" cy="13" r="7" fill="#34d399" opacity="0.25" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">
      HUNGOS v2.9.7-LTS // ONLINE
    </text>
  </g>

  <!-- Terminal Location/Tag -->
  <g transform="translate(680, 42)">
    <text x="150" y="17" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.5" opacity="0.9">
      RMIT VIETNAM ◈ SE (HONS)
    </text>
  </g>

  <!-- Main Headline / Name -->
  <text x="48" y="122" class="sans" font-size="44" font-weight="800" fill="url(#textGradient)" letter-spacing="-0.5">
    Vũ Gia Hưng
  </text>
  <text x="360" y="118" class="mono" font-size="19" font-weight="500" fill="#64748b">
    / Hung Vu Gia
  </text>

  <!-- Subtitle / Role -->
  <text x="48" y="156" class="sans" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Software Engineering Student @ <tspan fill="#38bdf8" font-weight="700">RMIT University Vietnam</tspan> • Class of 2025–2029
  </text>

  <!-- Interactive / Aesthetic Tech Tag Pills -->
  <g transform="translate(48, 185)">
    <!-- Pill 1: AI & ML -->
    <g class="pill" transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="28" rx="6" fill="#0e1b30" stroke="#1e3a5f" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#38bdf8" />
      <text x="24" y="18" class="mono" font-size="11" font-weight="600" fill="#7dd3fc">AI, LLMs &amp; RAG</text>
    </g>

    <!-- Pill 2: Embedded & Robotics -->
    <g class="pill" transform="translate(182, 0)">
      <rect x="0" y="0" width="190" height="28" rx="6" fill="#14142b" stroke="#2e2b5f" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#a78bfa" />
      <text x="24" y="18" class="mono" font-size="11" font-weight="600" fill="#c4b5fd">Embedded &amp; Robotics</text>
    </g>

    <!-- Pill 3: Systems & Benchmarking -->
    <g class="pill" transform="translate(384, 0)">
      <rect x="0" y="0" width="205" height="28" rx="6" fill="#0d1f1d" stroke="#184e45" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#34d399" />
      <text x="24" y="18" class="mono" font-size="11" font-weight="600" fill="#6ee7b7">Performance Engineering</text>
    </g>

    <!-- Pill 4: WebGL & Modern Web -->
    <g class="pill" transform="translate(601, 0)">
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#1f1824" stroke="#482d5a" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#f472b6" />
      <text x="24" y="18" class="mono" font-size="11" font-weight="600" fill="#fbcfe8">Three.js &amp; Modern Web</text>
    </g>
  </g>
</svg>
