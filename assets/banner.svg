<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#091224" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Accent Gradient for Name -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoGlow" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      @keyframes pulseDot {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .twinkle { animation: pulseDot 3s ease-in-out infinite; }
      .twinkle-2 { animation: pulseDot 4.5s ease-in-out infinite 1.5s; }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="876" height="176" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="70" r="140" fill="url(#cyanGlow)" />
  <circle cx="740" cy="110" r="140" fill="url(#indigoGlow)" />

  <!-- Starfield Points -->
  <g fill="#38bdf8">
    <circle cx="90" cy="35" r="1.5" class="twinkle" opacity="0.8" />
    <circle cx="220" cy="28" r="1" class="twinkle-2" opacity="0.6" />
    <circle cx="360" cy="45" r="1.5" class="twinkle" opacity="0.7" />
    <circle cx="510" cy="25" r="1" class="twinkle-2" opacity="0.5" />
    <circle cx="690" cy="40" r="1.5" class="twinkle" opacity="0.8" />
    <circle cx="810" cy="30" r="1" class="twinkle-2" opacity="0.6" />
    <circle cx="75" cy="140" r="1" class="twinkle-2" opacity="0.6" />
    <circle cx="280" cy="155" r="1.5" class="twinkle" opacity="0.7" />
    <circle cx="590" cy="145" r="1" class="twinkle-2" opacity="0.5" />
    <circle cx="790" cy="150" r="1.5" class="twinkle" opacity="0.8" />
  </g>

  <!-- Decorative Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 16 32 L 16 16 L 32 16" />
    <path d="M 864 32 L 864 16 L 848 16" />
    <path d="M 16 148 L 16 164 L 32 164" />
    <path d="M 864 148 L 864 164 L 848 164" />
  </g>

  <!-- University Tag (Top Right) -->
  <g transform="translate(680, 24)">
    <text x="150" y="16" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.5" opacity="0.9">
      RMIT VIETNAM ◈ SE (HONS)
    </text>
  </g>

  <!-- Main Headline / Name -->
  <g transform="translate(52, 92)">
    <text x="0" y="0" class="sans" font-size="46" font-weight="800" fill="url(#textGradient)" letter-spacing="-0.5">
      Vũ Gia Hưng
    </text>
    <text x="325" y="-5" class="mono" font-size="19" font-weight="500" fill="#64748b">
      / Hung Vu Gia
    </text>
  </g>

  <!-- Subtitle / Role -->
  <text x="52" y="132" class="sans" font-size="16.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Software Engineering Student @ <tspan fill="#38bdf8" font-weight="700">RMIT University Vietnam</tspan> • Class of 2025–2029
  </text>
</svg>
