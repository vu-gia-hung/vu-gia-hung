<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0d1f3b" />
      <stop offset="55%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Leather Cover Gradient -->
    <linearGradient id="coverLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Chrome Corner Bracket Gradient -->
    <linearGradient id="cornerChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Center Spine Highlight Gradient -->
    <linearGradient id="spineHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="20%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Left Page Parchment Surface Gradient -->
    <linearGradient id="leftPageSurf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1325" />
      <stop offset="8%" stop-color="#111c33" />
      <stop offset="30%" stop-color="#16233f" />
      <stop offset="85%" stop-color="#192847" />
      <stop offset="100%" stop-color="#080e1b" />
    </linearGradient>

    <!-- Right Base Page Gradient -->
    <linearGradient id="rightBaseSurf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080e1b" />
      <stop offset="15%" stop-color="#15213a" />
      <stop offset="70%" stop-color="#121b30" />
      <stop offset="92%" stop-color="#0e1628" />
      <stop offset="100%" stop-color="#080e1b" />
    </linearGradient>

    <!-- Flipping Page Front Gradient -->
    <linearGradient id="flippingPageSurf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090f1e" />
      <stop offset="15%" stop-color="#1a2949" />
      <stop offset="70%" stop-color="#16243f" />
      <stop offset="92%" stop-color="#121d35" />
      <stop offset="100%" stop-color="#0b1325" />
    </linearGradient>

    <!-- Curled Page Backside (Underside of turning page) -->
    <linearGradient id="pageCurlBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Silk Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Fountain Pen Barrel Gradient -->
    <linearGradient id="penBarrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="55%" stop-color="#090d16" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Fountain Pen Nib Metallic Gradient -->
    <linearGradient id="penNibMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Full Blue Solid CTA Gradient ("Khung màu xanh hoàn toàn lun cho nổi lên") -->
    <linearGradient id="fullBlueCtaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="cyanAtmosphere" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softContactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Card Background Frame -->
  <rect x="6" y="6" width="788" height="568" rx="20" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="780" height="560" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Ambient Star Particles in Space -->
  <g opacity="0.35">
    <circle cx="85" cy="55" r="1.5" fill="#38bdf8" />
    <circle cx="150" cy="95" r="1" fill="#7dd3fc" />
    <circle cx="705" cy="55" r="1.5" fill="#38bdf8" />
    <circle cx="725" cy="110" r="1" fill="#ffffff" />
    <circle cx="75" cy="465" r="1.5" fill="#38bdf8" />
    <circle cx="715" cy="460" r="1.5" fill="#7dd3fc" />
    <circle cx="400" cy="25" r="1" fill="#ffffff" />
  </g>

  <!-- Soft Blue Glow behind Book -->
  <ellipse cx="400" cy="265" rx="350" ry="200" fill="#0284c7" opacity="0.12" filter="url(#cyanAtmosphere)" />

  <!-- ==================== MAIN NOTEBOOK ==================== -->
  <g id="notebook-main">
    <!-- Grounding Contact Shadow Beneath the Whole Book -->
    <ellipse cx="400" cy="478" rx="345" ry="24" fill="#000000" opacity="0.9" filter="url(#softContactShadow)" />
    <ellipse cx="400" cy="478" rx="320" ry="16" fill="#000000" opacity="0.8" />

    <!-- 1. HARDCOVER LEATHER BASE -->
    <!-- Left Leather Cover Flap -->
    <path d="M 52 50 Q 230 44 395 52 L 395 470 Q 230 464 52 470 Z" fill="url(#coverLeather)" stroke="#0c4a6e" stroke-width="2" />
    <!-- Right Leather Cover Flap -->
    <path d="M 405 52 Q 570 44 748 50 L 748 470 Q 570 464 405 470 Z" fill="url(#coverLeather)" stroke="#0c4a6e" stroke-width="2" />

    <!-- Handcrafted Leather Stitches (Dashed Cyan Lines) -->
    <path d="M 62 60 Q 230 54 388 60 L 388 460 Q 230 454 62 460 Z" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.55" />
    <path d="M 412 60 Q 570 54 738 60 L 738 460 Q 570 454 412 460 Z" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.55" />

    <!-- 4 Metallic Corner Brackets -->
    <path d="M 52 90 L 52 50 L 92 50 Q 72 70 52 90 Z" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="68" cy="66" r="2.5" fill="#020617" />
    <path d="M 52 430 L 52 470 L 92 470 Q 72 450 52 430 Z" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="68" cy="454" r="2.5" fill="#020617" />
    <path d="M 748 90 L 748 50 L 708 50 Q 728 70 748 90 Z" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="732" cy="66" r="2.5" fill="#020617" />
    <path d="M 748 430 L 748 470 L 708 470 Q 728 450 748 430 Z" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="732" cy="454" r="2.5" fill="#020617" />

    <!-- 2. MULTI-LAYER STACKED PAGES -->
    <!-- Left Stacked Pages Layers -->
    <path d="M 76 60 L 392 62 L 392 460 L 76 460 Z" fill="#060a14" />
    <path d="M 73 63 L 392 64 L 392 457 L 73 457 Z" fill="#090f1d" />
    <path d="M 70 66 L 392 66 L 392 454 L 70 454 Z" fill="#0c1426" stroke="#1e293b" stroke-width="0.5" />
    <path d="M 67 69 L 392 68 L 392 451 L 67 451 Z" fill="#101a30" />
    <path d="M 64 72 L 392 70 L 392 448 L 64 448 Z" fill="#13203b" stroke="#1e293b" stroke-width="0.5" />
    <path d="M 62 75 L 392 72 L 392 445 L 62 445 Z" fill="#172645" />

    <!-- Right Stacked Pages Layers -->
    <path d="M 408 62 L 724 60 L 724 460 L 408 460 Z" fill="#060a14" />
    <path d="M 408 64 L 727 63 L 727 457 L 408 457 Z" fill="#090f1d" />
    <path d="M 408 66 L 730 66 L 730 454 L 408 454 Z" fill="#0c1426" stroke="#1e293b" stroke-width="0.5" />
    <path d="M 408 68 L 733 69 L 733 451 L 408 451 Z" fill="#101a30" />
    <path d="M 408 70 L 736 72 L 736 448 L 408 448 Z" fill="#13203b" stroke="#1e293b" stroke-width="0.5" />
    <path d="M 408 72 L 738 75 L 738 445 L 408 445 Z" fill="#172645" />

    <!-- 3. TOP OPEN PARCHMENT PAGES -->
    <!-- Left Top Page (Arched upward from binding) -->
    <path d="M 395 74 Q 230 64 66 73 L 66 442 Q 230 450 395 442 Z" fill="url(#leftPageSurf)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Subtle Faint Ruled Lines on Left Page -->
    <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
      <line x1="95" y1="108" x2="365" y2="110" />
      <line x1="95" y1="138" x2="365" y2="140" />
      <line x1="95" y1="168" x2="365" y2="170" />
      <line x1="95" y1="198" x2="365" y2="200" />
      <line x1="95" y1="228" x2="365" y2="230" />
      <line x1="95" y1="258" x2="365" y2="260" />
      <line x1="95" y1="288" x2="365" y2="290" />
      <line x1="95" y1="318" x2="365" y2="320" />
      <line x1="95" y1="348" x2="365" y2="350" />
      <line x1="95" y1="378" x2="365" y2="380" />
      <line x1="95" y1="408" x2="365" y2="410" />
    </g>

    <!-- Right Base Page (Visible underneath when turning page lifts) -->
    <path d="M 405 74 Q 570 64 734 73 L 734 442 Q 570 450 405 442 Z" fill="url(#rightBaseSurf)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Lines on Right Base Page -->
    <g opacity="0.14" stroke="#38bdf8" stroke-width="1">
      <line x1="435" y1="110" x2="705" y2="108" />
      <line x1="435" y1="140" x2="705" y2="138" />
      <line x1="435" y1="170" x2="705" y2="168" />
      <line x1="435" y1="200" x2="705" y2="198" />
      <line x1="435" y1="230" x2="705" y2="228" />
      <line x1="435" y1="260" x2="705" y2="258" />
      <line x1="435" y1="290" x2="705" y2="288" />
      <line x1="435" y1="320" x2="705" y2="318" />
      <line x1="435" y1="350" x2="705" y2="348" />
      <line x1="435" y1="380" x2="705" y2="378" />
      <line x1="435" y1="410" x2="705" y2="408" />
    </g>

    <!-- Dynamic Lift Shadow under flipping page -->
    <path fill="#020617">
      <animate attributeName="opacity" values="0.1; 0.1; 0.65; 0.75; 0.3; 0.1" dur="4s" repeatCount="indefinite" />
      <animate attributeName="d" 
        values="M 405,74 Q 570,64 734,73 L 734,442 Q 570,450 405,442 Z;
                M 405,74 Q 570,64 734,73 L 734,442 Q 570,450 405,442 Z;
                M 405,74 Q 540,55 670,62 L 685,432 Q 545,440 405,442 Z;
                M 405,74 Q 510,40 600,50 L 615,420 Q 510,428 405,442 Z;
                M 405,74 Q 550,60 700,68 L 710,438 Q 555,446 405,442 Z;
                M 405,74 Q 570,64 734,73 L 734,442 Q 570,450 405,442 Z"
        dur="4s" repeatCount="indefinite" />
    </path>

    <!-- 4. FLIPPING PAGE WITH REALISTIC PATH MORPHING -->
    <g>
      <!-- Turning Page Leaf -->
      <path fill="url(#flippingPageSurf)" stroke="#0284c7" stroke-width="1.2">
        <animate attributeName="d"
          values="M 405,74 Q 570,64 734,73 L 734,442 Q 570,450 405,442 Z;
                  M 405,74 Q 570,64 734,73 L 734,442 Q 570,450 405,442 Z;
                  M 405,74 Q 540,50 670,58 L 685,428 Q 545,436 405,442 Z;
                  M 405,74 Q 510,35 600,45 L 615,415 Q 510,423 405,442 Z;
                  M 405,74 Q 550,55 700,64 L 710,434 Q 555,442 405,442 Z;
                  M 405,74 Q 570,64 734,73 L 734,442 Q 570,450 405,442 Z"
          dur="4s" repeatCount="indefinite" />
      </path>

      <!-- Turning Page Curling Corner Flap -->
      <polygon fill="url(#pageCurlBack)" stroke="#7dd3fc" stroke-width="1">
        <animate attributeName="opacity" values="0; 0; 0.95; 1; 0.4; 0" dur="4s" repeatCount="indefinite" />
        <animate attributeName="points"
          values="734,73 734,73 734,73;
                  734,73 734,73 734,73;
                  670,58 720,50 685,120;
                  600,45 660,35 620,135;
                  700,64 725,60 705,100;
                  734,73 734,73 734,73"
          dur="4s" repeatCount="indefinite" />
      </polygon>
    </g>

    <!-- Central Deep Binding Gutter & Spine Highlight -->
    <path d="M 393 72 L 407 72 L 407 444 L 393 444 Z" fill="#04060d" />
    <path d="M 398 50 L 402 50 L 402 472 L 398 472 Z" fill="url(#spineHighlight)" />

    <!-- Silk Bookmark Ribbon (with subtle gentle swing) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 400 48; 1.5 400 48; 0 400 48; -1 400 48; 0 400 48"
        dur="6s" repeatCount="indefinite" />
      <path d="M 400 48 Q 425 155 435 270 Q 445 385 460 480 L 478 475 L 468 445 L 492 440 Q 460 350 445 235 Q 430 120 404 48 Z" fill="url(#ribbonSilk)" opacity="0.95" filter="url(#cyanAtmosphere)" />
    </g>

    <!-- 5. FLOATING FOUNTAIN PEN -->
    <g transform="translate(615, 345) rotate(-28)">
      <animateTransform attributeName="transform" type="translate"
        values="615,345; 612,338; 615,345; 618,348; 615,345"
        dur="4s" repeatCount="indefinite" />
      
      <!-- Pen Cast Shadow on paper -->
      <rect x="0" y="16" width="220" height="18" rx="9" fill="#000000" opacity="0.55" filter="url(#cyanAtmosphere)" />
      
      <!-- Pen Cap / Finial End -->
      <rect x="180" y="0" width="30" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      
      <!-- Pen Barrel -->
      <rect x="50" y="0" width="132" height="18" rx="3" fill="url(#penBarrel)" stroke="#334155" stroke-width="1" />
      
      <!-- Chrome & Cyan Accent Rings -->
      <rect x="62" y="0" width="4" height="18" fill="#38bdf8" />
      <rect x="66" y="0" width="1.5" height="18" fill="#ffffff" />
      <rect x="172" y="0" width="8" height="18" fill="url(#cornerChrome)" />
      <rect x="174" y="0" width="2" height="18" fill="#ffffff" />
      
      <!-- Pen Metallic Pocket Clip -->
      <rect x="100" y="-4" width="70" height="4" rx="2" fill="url(#cornerChrome)" stroke="#7dd3fc" stroke-width="0.5" />
      <circle cx="102" cy="-2" r="3" fill="#38bdf8" />
      
      <!-- Pen Grip Section -->
      <path d="M 50 1 L 22 4 L 22 14 L 50 17 Z" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
      <rect x="22" y="4" width="3" height="10" fill="#38bdf8" />
      
      <!-- Metallic Pen Nib -->
      <path d="M 22 4 L 0 9 L 22 14 Z" fill="url(#penNibMetal)" stroke="#7dd3fc" stroke-width="1" />
      
      <!-- Nib Breather Hole & Ink Slit -->
      <line x1="0" y1="9" x2="15" y2="9" stroke="#060913" stroke-width="1.2" />
      <circle cx="15" cy="9" r="1.6" fill="#060913" />
      
      <!-- Glowing Blue Ink Droplet at Nib Tip (Pulsing) -->
      <g>
        <circle cx="-1" cy="9" fill="#38bdf8" filter="url(#cyanAtmosphere)">
          <animate attributeName="r" values="3; 5.5; 3" dur="2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle cx="-1" cy="9" r="1.5" fill="#ffffff" />
      </g>
    </g>

    <!-- ==================== 6. BOTTOM CALL-TO-ACTION CAPTION ==================== -->
    <!-- Centered in the SVG as an image caption with completely blue solid glowing frame ("khung màu xanh hoàn toàn lun cho nổi lên") -->
    <g transform="translate(400, 526)">
      <!-- Soft Outer Cyan Glow for prominence -->
      <rect x="-240" y="-21" width="480" height="42" rx="21" fill="#38bdf8" opacity="0.35" filter="url(#cyanAtmosphere)">
        <animate attributeName="opacity" values="0.25; 0.55; 0.25" dur="3s" repeatCount="indefinite" />
      </rect>

      <!-- Solid Electric Blue Pill Frame ("khung màu xanh hoàn toàn") -->
      <rect x="-235" y="-19" width="470" height="38" rx="19" fill="url(#fullBlueCtaGrad)" stroke="#e0f2fe" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite" />
      </rect>

      <!-- Glossy top reflection highlight -->
      <path d="M -215 -17 Q 0 -13 215 -17" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" fill="none" />

      <!-- High-contrast crisp text in horizontal & vertical center -->
      <text x="0" y="6" fill="#020817" font-size="14.5" font-weight="800" text-anchor="middle" class="font-sans" letter-spacing="0.6">
        Click here to leave your mark on my profile
      </text>
    </g>
  </g>
</svg>
