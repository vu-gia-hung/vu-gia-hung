name: Refresh Guestbook Usernames

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-guestbook-usernames
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh guestbook usernames
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-guestbook-usernames.js

      - name: Commit and push update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guestbook.json README.md
          if git diff --cached --quiet; then
            echo "No guestbook changes to commit"
          else
            git commit -m "chore(guestbook): refresh usernames from GitHub [skip ci]"
            bash scripts/push-main.sh
          fi
