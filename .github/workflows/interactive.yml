name: Interactive Profile Widgets

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  handle-interaction:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'guestbook')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process Issue Interaction
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_USER_AVATAR: ${{ github.event.issue.user.avatar_url }}
        run: |
          node scripts/handle-interactive.js

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(interactive): update profile widgets [skip ci]"
          fi
          git push

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Thank you **@$ISSUE_USER** for leaving your mark on Vu Gia Hung's guestbook! Your message has been updated directly on the profile! 🚀💙"
