name: Generate GitHub Profile 3D Contrib

on:
  schedule:
    # Run once every 24 hours at 17:00 UTC (00:00 AM VN Time)
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Activity Graph With Point Labels
        run: node scripts/update-activity-graph.js

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets/activity-graph-dark.svg assets/activity-graph-light.svg
          git commit -m "chore: auto update 3d graph and activity graph with point labels" || exit 0
          git push
