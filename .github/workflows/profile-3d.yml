name: Generate GitHub Profile 3D Contrib

on:
  schedule:
    # Run once every 24 hours at 17:00 UTC (00:00 AM VN Time)
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'vu-gia-hung/vu-gia-hung' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    environment: profile-bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Activity Graph, 3D Graph & Trophies With Cosmic Blue Theme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-activity-graph.js

      - name: Check out main for publishing
        uses: actions/checkout@v4
        with:
          ref: main
          path: profile-publish
          fetch-depth: 0
          ssh-key: ${{ secrets.PROFILE_DEPLOY_KEY }}

      - name: Copy generated profile images
        run: |
          cp profile-3d-contrib/profile-{night-view,blue}.svg profile-publish/profile-3d-contrib/
          cp assets/{activity-graph,trophies}-{dark,light}.svg profile-publish/assets/

      - name: Commit & Push changes
        working-directory: profile-publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto update 3d graph, activity graph and trophies"
            bash scripts/push-main.sh
          fi
