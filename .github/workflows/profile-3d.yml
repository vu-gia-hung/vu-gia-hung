name: Generate GitHub Profile 3D Contrib

on:
  schedule:
    # Run once every 24 hours at 17:00 UTC (00:00 AM VN Time)
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Activity Graph, 3D Graph & Trophies With Cosmic Blue Theme
        run: node scripts/update-activity-graph.js

      - name: Clean up unused 3D themes
        run: |
          find profile-3d-contrib/ -type f ! -name 'profile-night-view.svg' ! -name 'profile-blue.svg' -delete

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto update 3d graph, activity graph and trophies"
          fi
          bash scripts/push-main.sh
